[package]
name = "lokalbot-ai"
description = "Think, Autocomplete and embeddings: model catalog, downloads, llama.cpp runtime, prompts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lokalbot-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
log.workspace = true
parking_lot.workspace = true
ureq.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
# Runtime and model archives: llama.cpp ships .zip (Windows) and .tar.gz
# (Linux); sherpa-onnx models are .tar.bz2. All decoders are pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
