[package]
name = "lokalbot-app"
description = "LokalBot for Linux and Windows: private work memory with on-device AI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "lokalbot"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
lokalbot-core.workspace = true
lokalbot-ai.workspace = true
lokalbot-agent.workspace = true
lokalbot-audio.workspace = true
lokalbot-engine.workspace = true
lokalbot-platform.workspace = true
lokalbot-speech.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
directories.workspace = true
parking_lot.workspace = true
async-channel = "2"
smol = "2"
# PNG for the tray icon; JPEG for screen images decrypted for display.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
